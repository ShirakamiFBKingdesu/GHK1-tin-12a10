<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giới thiệu bản thân</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      color: white;
      background-color: #15191f;
      background-image: url("C:/Users/Admin/Pictures/130823834_p1.png");
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      margin: 0;
      min-height: 100vh;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 460px;
      background-color: rgba(15, 18, 22, 0.88);
      padding: 30px;
      border: 2px solid #00ff88;
      border-radius: 18px;
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.25);
    }

    .signature {
      text-align: center;
      color: #00ff88;
      font-size: 13px;
      letter-spacing: 3px;
      margin-bottom: 15px;
    }

    h1 {
      text-align: center;
      font-size: 26px;
      color: #00ff88;
      line-height: 1.4;
      margin: 0 0 25px;
    }

    .avatar {
      width: 120px;
      height: 120px;
      margin: 0 auto 25px;
      border: 2px dashed #00ff88;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 15px;
      color: #c9d2d9;
      background-color: rgba(255, 255, 255, 0.05);
      font-size: 14px;
      line-height: 1.5;
    }

    .info-section {
      margin-top: 18px;
      padding: 15px;
      background-color: rgba(255, 255, 255, 0.05);
      border-left: 4px solid #00ff88;
      border-radius: 5px;
    }

    h2 {
      font-size: 17px;
      color: #ffd700;
      margin: 0 0 8px;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      margin: 0;
      overflow-wrap: anywhere;
    }

    .name {
      font-size: 20px;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      color: #00ff88;
      font-size: 13px;
      margin-top: 25px;
      letter-spacing: 1px;
    }

    @media (max-width: 480px) {
      body {
        padding: 20px 12px;
      }

      .container {
        padding: 22px 18px;
      }

      h1 {
        font-size: 23px;
      }

      .info-section {
        padding: 13px;
      }

      p {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="signature">✦ PERSONAL PROFILE ✦</div>

    <h1>GIỚI THIỆU BẢN THÂN</h1>

    <div class="avatar" role="img" aria-label="Chưa có ảnh đại diện">
      Chưa có ảnh đại diện
    </div>

    <div class="info-section">
      <h2>✦ Tên</h2>
      <p class="name">Cá Ươn (sukonbu)</p>
    </div>

    <div class="info-section">
      <h2>✦ Nơi làm việc</h2>
      <p>Skibidi toliet ww</p>
    </div>

    <div class="info-section">
      <h2>✦ Tuổi</h2>
      <p>69</p>
    </div>

    <div class="footer">★ THANK YOU FOR VISITING ★</div>
  </div>
</body>
</html>
